  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink:#18212b; --muted:#5a6573; --paper:#f3f0e8; --panel:#fffcf6;
      --line:#d5ccbc; --teal:#0d6758; --teal-soft:#d7efe9;
      --amber:#8a5314; --amber-soft:#f2e3cf; --rose:#8d3030; --rose-soft:#f2d8d8;
      --green:#1d6840; --green-soft:#d8ecdf;
      --serif:"Noto Serif SC","Songti SC",serif;
      --sans:"Noto Sans SC","PingFang SC",sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.65;
      background:radial-gradient(900px 420px at 0% 0%,#dceee8 0%,transparent 55%),radial-gradient(800px 380px at 100% 0%,#efe4d3 0%,transparent 50%),var(--paper)}
    .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 72px}
    h1,h2,h3{font-family:var(--serif);margin:0 0 10px;font-weight:700}
    h1{font-size:clamp(1.55rem,3.4vw,2.2rem)}
    .lead{color:var(--muted);max-width:46rem;margin:0 0 16px}
    button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px}
    button:hover{border-color:var(--teal)}
    button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
    button.ghost{background:transparent}
    button:disabled{opacity:.45;cursor:not-allowed}
    .topbar,.steps,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
    .grid{display:grid;gap:12px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .mod{cursor:pointer;text-align:left;padding:14px}
    .mod .tag{color:var(--muted);font-size:.88rem}
    .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.82rem;background:var(--teal-soft);color:var(--teal);margin:2px}
    .pill.warn{background:var(--amber-soft);color:var(--amber)}
    .pill.bad{background:var(--rose-soft);color:var(--rose)}
    .pill.ok{background:var(--green-soft);color:var(--green)}
    .callout{border-left:4px solid var(--teal);background:var(--teal-soft);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0}
    .callout.warn{border-left-color:var(--amber);background:var(--amber-soft)}
    .callout.ok{border-left-color:var(--green);background:var(--green-soft)}
    .callout.bad{border-left-color:var(--rose);background:var(--rose-soft)}
    .box{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
    .options{display:grid;gap:8px;margin:10px 0}
    .options button{text-align:left}
    input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff}
    .muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse;font-size:.95rem}
    th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--muted);font-weight:500}
    .stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .stat{background:var(--teal-soft);border-radius:12px;padding:12px 14px}
    .stat b{display:block;font-family:var(--serif);font-size:1.25rem}
    .stat span{color:var(--muted);font-size:.9rem}
    .score{font-family:var(--serif);font-size:1.8rem;color:var(--teal)}
    [hidden]{display:none!important}
    @media(max-width:760px){.grid-2,.stat-row{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.grid-2,.stat-row{grid-template-columns:1fr}}
  </style>
</head>

      "$\\angle DPB=150^{\\circ}-60^{\\circ}=90^{\\circ}$，$BD=5$ ⇒ $PB=\\sqrt{25-9}=4$。",
      "第23：先共线特殊化用 $180^{\\circ}$ 旋转证全等，再一般化证 $AO=EO$，最后动态最值。"
    ],
    tip:"第18题关键是‘旋转角=60°’与‘150°-60°=90°’。"
  },
  drill:[
    {id:"d1",type:"blank",stem:"第18题结论：$PB=$？",answer:"4",accept:["4"],explain:"直角边，$\\sqrt{25-9}=4$。"},
    {id:"d2",type:"choice",stem:"F绕E旋转180°得G，一定正确？",options:["A. EG=2EF","B. E是FG中点且EG=EF","C. ∠FEG=90°","D. FG⊥EF"],answer:"B",explain:"180°旋转中心为中点。"},
    {id:"d3",type:"choice",stem:"第23题探究顺序体现的思维是？",options:["A. 只算数字","B. 特殊→一般→拓展","C. 随机尝试","D. 只记结论"],answer:"B",explain:"问题提出—特殊化—一般化—拓展最值。"}
  ],
  review:["旋转性质默写","角度差构造直角","特殊化再一般化"],
  exam:[
    {id:"e1",type:"blank",stem:"【仿18题】等边△中，旋转后得等边△ADP，$\\angle APB=150^{\\circ}$，则 $\\angle DPB=$？",answer:"90",accept:["90","90°","90^{\\circ}"],explain:"$150^{\\circ}-60^{\\circ}=90^{\\circ}$。"},
    {id:"e2",type:"blank",stem:"【仿18题】若 $BD=13$，$PD=5$，且 $\\angle DPB=90^{\\circ}$，则 $PB=$？",answer:"12",accept:["12"],explain:"勾股：$\\sqrt{169-25}=12$。"}
  ]
}
];

function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return{}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
let state=Object.assign({view:"home",unitId:null,stage:"map",answers:{},checked:{}},load());
function persist(){save({view:state.view,unitId:state.unitId,stage:state.stage,answers:state.answers,checked:state.checked})}

function norm(s){return String(s||"").replace(/\s+/g,"").replace(/／/g,"/").replace(/，/g,",").replace(/（/g,"(").replace(/）/g,")").replace(/°/g,"").toLowerCase()}
function isCorrect(q,raw){const n=norm(raw);if(!n)return false;return [q.answer,...(q.accept||[])].map(norm).some(k=>k===n)}
function mathify(s){
  if(s==null)return"";s=String(s);if(!window.katex)return s;
  const r=(tex,d)=>{try{return katex.renderToString(tex,{displayMode:!!d,throwOnError:false,strict:"ignore"})}catch{return tex}};
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(_,t)=>r(t,true));
  s=s.replace(/\$([^$]+?)\$/g,(_,t)=>r(t,false));
  return s;
}
function el(html){const t=document.createElement("template");t.innerHTML=mathify(html).trim();return t.content.firstElementChild}
function unitScore(u){
  const qs=[...u.drill,...u.exam];let ok=0,done=0;
  qs.forEach(q=>{const k=u.id+":"+q.id;if(state.checked[k]){done++;if(isCorrect(q,state.answers[k]))ok++}});
  return{ok,done,total:qs.length,finished:done===qs.length&&done>0};
}
function setView(v,uid,stage){state.view=v;if(uid!==undefined)state.unitId=uid;if(stage!==undefined)state.stage=stage;persist();render()}

function renderTop(){
  const bar=document.getElementById("topbar");bar.innerHTML="";
  const mk=(lab,v,extra)=>{const b=el(`<button class="${state.view===v&&!extra?'primary':''}">${lab}</button>`);b.onclick=()=>setView(v);bar.appendChild(b)};
  mk("分类总览","home");
  mk("知识结构表","structure");
  if(state.view==="unit"){const b=el(`<button class="ghost">返回单元列表</button>`);b.onclick=()=>setView("home");bar.appendChild(b)}
  const clr=el(`<button class="ghost">清空进度</button>`);
  clr.onclick=()=>{if(confirm("清空全部作答？")){state.answers={};state.checked={};persist();render()}};
  bar.appendChild(clr);
}

function renderHome(){
  const app=document.getElementById("app");app.innerHTML="";
  let doneU=UNITS.filter(u=>unitScore(u).finished).length;
  app.appendChild(el(`<div class="stat-row">
    <div class="stat"><b>${doneU}/8</b><span>已测完单元</span></div>
    <div class="stat"><b>8</b><span>教学分块</span></div>
    <div class="stat"><b>讲解→训练→复习→仿卷</b><span>单块流程</span></div>
    <div class="stat"><b>18·19·20·23</b><span>本轮新增题</span></div>
  </div>`));
  app.appendChild(el(`<div class="panel"><h2>按「二次函数学习中的教学」分类</h2>
    <p class="muted">五段式（认识→性质→方程不等式→应用→综合）+ 函数交汇 + 几何变换。每块可独立训练。</p>
    <table><thead><tr><th>单元</th><th>分类</th><th>卷题</th><th>进度</th></tr></thead><tbody>
    ${UNITS.map(u=>{const s=unitScore(u);return`<tr><td>${u.id} ${u.title}</td><td>${u.cat}</td><td>${u.exams.join("、")}</td><td>${s.done}/${s.total}</td></tr>`}).join("")}
    </tbody></table></div>`));
  const grid=el(`<div class="grid grid-2"></div>`);
  UNITS.forEach(u=>{
    const s=unitScore(u);
    const card=el(`<button class="panel mod"><div class="tag">${u.id} · ${u.cat}</div><h3>${u.title}</h3>
      <div class="muted">对应：${u.exams.join("、")}</div>
      <div style="margin-top:8px">${u.knowledge.slice(0,2).map(k=>`<span class="pill">${k.replace(/\$/g,"")}</span>`).join("")}</div>
      <div class="muted" style="margin-top:8px">${s.finished?"已完成训练":"讲解 → 训练 → 复习 → 仿卷"}</div></button>`);
    card.onclick=()=>setView("unit",u.id,"map");
    grid.appendChild(card);
  });
  app.appendChild(grid);
}

function renderStructure(){
  const app=document.getElementById("app");app.innerHTML="";
  const focus=["U1","U5","U7","U8"]; // 19,20,18,23 heavy
  UNITS.forEach(u=>{
    app.appendChild(el(`<div class="panel">
      <h2>${u.id} ${u.title} <span class="pill">${u.cat}</span></h2>
      <p class="muted">卷题：${u.exams.join("、")}</p>
      <h3>知识结构</h3><ul>${u.knowledge.map(k=>`<li>${k}</li>`).join("")}</ul>
      <h3>逻辑结构</h3><ol>${u.logic.map(k=>`<li>${k}</li>`).join("")}</ol>
      <h3>思维方式</h3><ul>${u.thinking.map(k=>`<li>${k}</li>`).join("")}</ul>
      <button class="primary" data-go="${u.id}">进入本单元训练</button>
    </div>`));
  });
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setView("unit",b.getAttribute("data-go"),"map"));
}

function renderUnit(){
  const u=UNITS.find(x=>x.id===state.unitId)||UNITS[0];
  const app=document.getElementById("app");app.innerHTML="";
  app.appendChild(el(`<div class="panel">
    <div class="muted">${u.id} · ${u.cat} · ${u.exams.join("、")}</div>
    <h2>${u.title}</h2>
    <div class="row">${u.thinking.map(t=>`<span class="pill warn">${t}</span>`).join("")}</div>
  </div>`));
  const steps=el(`<div class="steps"></div>`);
  [["map","① 结构图"],["explain","② 讲解"],["drill","③ 专项训练"],["review","④ 复习巩固"],["exam","⑤ 仿卷出题"]].forEach(([id,lab])=>{
    const b=el(`<button class="${state.stage===id?"primary":""}">${lab}</button>`);
    b.onclick=()=>setView("unit",u.id,id);steps.appendChild(b);
  });
  app.appendChild(steps);

  if(state.stage==="map"){
    app.appendChild(el(`<div class="panel">
      <h3>本单元三层结构</h3>
      <div class="box"><strong>知识结构</strong><ul>${u.knowledge.map(k=>`<li>${k}</li>`).join("")}</ul></div>
      <div class="box"><strong>逻辑结构</strong><ol>${u.logic.map(k=>`<li>${k}</li>`).join("")}</ol></div>
      <div class="box"><strong>思维方式</strong><ul>${u.thinking.map(k=>`<li>${k}</li>`).join("")}</ul></div>
      <div class="row"><button class="primary" id="goEx">开始讲解 →</button></div>
    </div>`));
    app.querySelector("#goEx").onclick=()=>setView("unit",u.id,"explain");
  }
  if(state.stage==="explain"){
    const e=u.explain;
    app.appendChild(el(`<div class="panel">
      <h3>${e.title}</h3>
      <div class="callout warn"><strong>题干：</strong>${e.stem}</div>
      <ol>${e.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="callout"><strong>思维点拨：</strong>${e.tip}</div>
      <div class="row"><button class="ghost" id="back">← 结构图</button><button class="primary" id="next">去专项训练 →</button></div>
    </div>`));
    app.querySelector("#back").onclick=()=>setView("unit",u.id,"map");
    app.querySelector("#next").onclick=()=>setView("unit",u.id,"drill");
  }
  if(state.stage==="drill") renderQuizList(app,u,u.drill,"专项训练","review");
  if(state.stage==="review"){
    app.appendChild(el(`<div class="panel">
      <h3>复习巩固 · 方法卡</h3>
      <ul>${u.review.map(r=>`<li>${r}</li>`).join("")}</ul>
      <div class="callout">合上笔记，用自己的话复述：本单元的<strong>知识结构</strong>、<strong>逻辑顺序</strong>、<strong>思维方式</strong>各是什么？然后进入仿卷。</div>
      <div class="row"><button class="ghost" id="back">← 训练</button><button class="primary" id="next">仿卷出题 →</button></div>
    </div>`));
    app.querySelector("#back").onclick=()=>setView("unit",u.id,"drill");
    app.querySelector("#next").onclick=()=>setView("unit",u.id,"exam");
  }
  if(state.stage==="exam") renderQuizList(app,u,u.exam,"仿卷训练（结合试卷题型变式）","done");
}

function renderQuizList(app,u,list,title,nextStage){
  const wrap=el(`<div><div class="panel"><h3>${title}</h3></div></div>`);
  list.forEach((q,idx)=>{
    const key=u.id+":"+q.id; const val=state.answers[key]||"";
    const done=!!state.checked[key]; const ok=done&&isCorrect(q,val); const bad=done&&!isCorrect(q,val);
    const card=el(`<div class="panel"><div><strong>第 ${idx+1} 题</strong>
      ${ok?'<span class="pill ok">正确</span>':''}${bad?'<span class="pill bad">再看</span>':''}</div>
      <p>${q.stem}</p></div>`);
    if(q.type==="choice"){
      const opts=el(`<div class="options"></div>`);
      q.options.forEach(opt=>{
        const letter=opt.trim()[0];
        const b=el(`<button class="${norm(val)===norm(letter)?"primary":""}">${opt}</button>`);
        b.onclick=()=>{state.answers[key]=letter;persist();render()};
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }else{
      const input=el(`<input type="text" placeholder="输入答案" />`);
      input.value=val; input.oninput=e=>{state.answers[key]=e.target.value};
      input.onchange=()=>persist(); card.appendChild(input);
    }
    const row=el(`<div class="row"></div>`);
    const sub=el(`<button class="primary">提交本题</button>`);
    sub.onclick=()=>{if(q.type==="blank"){const inp=card.querySelector("input");state.answers[key]=inp?inp.value:state.answers[key]} state.checked[key]=true;persist();render()};
    row.appendChild(sub); card.appendChild(row);
    if(done) card.appendChild(el(`<div class="callout ${ok?"ok":"bad"}"><strong>${ok?"正确。":"参考："+q.answer}</strong><div>${q.explain}</div></div>`));
    wrap.appendChild(card);
  });
  const s=list.reduce((acc,q)=>{const k=u.id+":"+q.id; if(state.checked[k]){acc.done++; if(isCorrect(q,state.answers[k]))acc.ok++} return acc},{ok:0,done:0});
  const foot=el(`<div class="panel"><p>本段进度：${s.ok}/${s.done||0}（共 ${list.length} 题）</p>
    <div class="row"><button class="primary" id="next" ${s.done===0?"disabled":""}>${nextStage==="done"?"完成本单元":"下一步 →"}</button></div></div>`);
  foot.querySelector("#next").onclick=()=>{
    if(nextStage==="done") setView("home");
    else setView("unit",u.id,nextStage);
  };
  wrap.appendChild(foot); app.appendChild(wrap);
}

function render(){
  renderTop();
  if(state.view==="home") renderHome();
  else if(state.view==="structure") renderStructure();
  else renderUnit();
}
document.addEventListener("DOMContentLoaded",()=>{if(!window.katex)console.error("KaTeX missing");render()});
</script>
