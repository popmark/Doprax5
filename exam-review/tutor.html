      { h: "定点套路", t: "$y-y_0=k(x-x_0)$ 形式 ⇒ 恒过 $(x_0,y_0)$。" },
      { h: "联立", t: "直线代入抛物线得二次方程，韦达定理表示两交点横坐标之和/积。" },
      { h: "对称", t: "抛物线 $y=x^{2}-2x-3$ 对称轴 $x=1$；横弦关于对称轴对称。" },
      { h: "推进策略", t: "第(1)问定点会做后，立刻写联立方程，不要停在“已经会一点”。" }
    ],
    explain: {
      title: "精讲原卷第24题",
      stem: "直线 $y=kx-k-1$ 与抛物线 $y=x^{2}-2x-3$ 交于 A,B。",
      steps: [
        "(1) $y+1=k(x-1)$ ⇒ 定点 $D(1,-1)$（已掌握）。",
        "联立：$x^2-(2+k)x+(k-2)=0$，用韦达表示 $x_A+x_B$、$x_Ax_B$。",
        "(2) 结合 $k<0$、交 y 轴、顶点、射线条件 $AG=AF$，列坐标等式求 $x_A$。",
        "(3) 过 B 作横线交抛物线于 C（对称点），再证/求直线 AC 的定点。"
      ],
      tip: "空白失分主因：不敢从定点走向韦达。先把联立写出来就成功一半。"
    },
    quiz: [
      {
        id: "q1", type: "blank",
        stem: "$y=k(x-2)+3$ 恒过定点？写成 (x,y)",
        answer: "(2,3)", accept: ["(2,3)", "（2，3）", "(2, 3)"],
        explain: "括号为 0 时读出定点 (2,3)。"
      },
      {
        id: "q2", type: "blank",
        stem: "$y=2kx-4k+1$ 的定点是？",
        answer: "(2,1)", accept: ["(2,1)", "（2，1）", "(2, 1)"],
        explain: "$y-1=2k(x-2)$ ⇒ (2,1)。"
      },
      {
        id: "q3", type: "choice",
        stem: "做完定点后，下一步通常是？",
        options: ["A. 直接放弃后面问", "B. 直线与抛物线联立并用韦达", "C. 只画草图不写方程", "D. 只求顶点不管交点"],
        answer: "B",
        explain: "定点之后立刻联立，是第24题(2)(3)的入口。"
      }
    ]
  }
];

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  } catch {
    return {};
  }
}
function saveState(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

let state = Object.assign({
  view: "home",
  moduleId: null,
  stage: "learn",
  answers: {},
  checked: {},
  moduleDone: {}
}, loadState());

function persist() {
  saveState({
    view: state.view,
    moduleId: state.moduleId,
    stage: state.stage,
    answers: state.answers,
    checked: state.checked,
    moduleDone: state.moduleDone
  });
}

function norm(s) {
  return String(s || "")
    .replace(/\s+/g, "")
    .replace(/／/g, "/")
    .replace(/，/g, ",")
    .replace(/（/g, "(")
    .replace(/）/g, ")")
    .replace(/√/g, "√")
    .toLowerCase();
}

function isCorrect(q, raw) {
  const n = norm(raw);
  if (!n) return false;
  const keys = [q.answer, ...(q.accept || [])].map(norm);
  return keys.some((k) => k === n);
}

function moduleScore(mod) {
  const qs = mod.quiz;
  let ok = 0, done = 0;
  qs.forEach((q) => {
    const key = mod.id + ":" + q.id;
    if (state.checked[key]) {
      done++;
      if (isCorrect(q, state.answers[key])) ok++;
    }
  });
  return { ok, done, total: qs.length, pct: done ? Math.round(ok / done * 100) : 0, finished: done === qs.length };
}

function overall() {
  let ok = 0, done = 0, total = 0;
  MODULES.forEach((m) => {
    const s = moduleScore(m);
    ok += s.ok; done += s.done; total += s.total;
  });
  return { ok, done, total, modulesDone: MODULES.filter((m) => moduleScore(m).finished).length };
}

function mathify(s) {
  if (s == null) return "";
  s = String(s);
  if (!window.katex) return s;
  const render = (tex, display) => {
    try {
      return katex.renderToString(tex, { displayMode: !!display, throwOnError: false, strict: "ignore" });
    } catch (e) {
      return tex;
    }
  };
  // display then inline
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => render(tex, true));
  s = s.replace(/\$([^$]+?)\$/g, (_, tex) => render(tex, false));
  return s;
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = mathify(html).trim();
  return t.content.firstElementChild;
}

function renderMath() { /* math already rendered via mathify/el */ }

function setView(view, moduleId, stage) {
  state.view = view;
  if (moduleId !== undefined) state.moduleId = moduleId;
  if (stage !== undefined) state.stage = stage;
  persist();
  render();
}

function renderTopbar() {
  const bar = document.getElementById("topbar");
  bar.innerHTML = "";
  const home = el(`<button class="${state.view === "home" ? "primary" : ""}">总览</button>`);
  home.onclick = () => setView("home");
  bar.appendChild(home);
  const report = el(`<button class="${state.view === "report" ? "primary" : ""}">总反馈报告</button>`);
  report.onclick = () => setView("report");
  bar.appendChild(report);
  if (state.view === "module") {
    const back = el(`<button class="ghost">返回模块列表</button>`);
    back.onclick = () => setView("home");
    bar.appendChild(back);
  }
  const reset = el(`<button class="ghost">清空进度</button>`);
  reset.onclick = () => {
    if (confirm("确定清空全部作答与进度？")) {
      state.answers = {};
      state.checked = {};
      state.moduleDone = {};
      persist();
      render();
    }
  };
  bar.appendChild(reset);
}

function renderHome() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const o = overall();
  app.appendChild(el(`
    <div class="stat-row">
      <div class="stat"><b>${o.modulesDone}/6</b><span>已测完模块</span></div>
      <div class="stat"><b>${o.ok}/${o.done || 0}</b><span>已批改正确</span></div>
      <div class="stat"><b>${o.total}</b><span>题库总量</span></div>
      <div class="stat"><b>${o.done ? Math.round(o.ok / o.done * 100) + "%" : "—"}</b><span>当前正确率</span></div>
    </div>
  `));
  app.appendChild(el(`
    <div class="panel">
      <h2>试卷薄弱点地图</h2>
      <p class="muted">来源：江汉区期中模拟卷 1 图片识别与红笔批改。建议按“很高 → 高 → 中”顺序学习。</p>
      <table>
        <thead><tr><th>模块</th><th>对应题</th><th>优先级</th><th>测试进度</th></tr></thead>
        <tbody>
          ${MODULES.map((m) => {
            const s = moduleScore(m);
            return `<tr>
              <td>${m.title}</td>
              <td>${m.exam}</td>
              <td><span class="pill ${m.priority === "很高" ? "bad" : m.priority === "高" ? "warn" : ""}">${m.priority}</span></td>
              <td>${s.done}/${s.total}${s.finished ? " · 已完成" : ""}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `));

  const grid = el(`<div class="grid grid-2"></div>`);
  MODULES.forEach((m) => {
    const s = moduleScore(m);
    const pct = Math.round(s.done / s.total * 100);
    const card = el(`
      <button class="panel mod-card">
        <div class="tag">${m.exam} · 优先级 ${m.priority}</div>
        <h3>${m.title}</h3>
        <div class="muted">${m.blurb}</div>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="muted" style="margin-top:6px">${s.finished ? `测试 ${s.ok}/${s.total}` : "学习 → 精讲 → 测试 → 反馈"}</div>
      </button>
    `);
    card.onclick = () => setView("module", m.id, "learn");
    grid.appendChild(card);
  });
  app.appendChild(grid);
}

function renderModule() {
  const mod = MODULES.find((m) => m.id === state.moduleId) || MODULES[0];
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(el(`
    <div class="panel">
      <div class="muted">${mod.exam} · 优先级 ${mod.priority}</div>
      <h2>${mod.title}</h2>
      <p>${mod.blurb}</p>
      <div class="row">${mod.goals.map((g) => `<span class="pill">${g}</span>`).join("")}</div>
    </div>
  `));

  const steps = el(`<div class="steps"></div>`);
  [["learn","① 学习"],["explain","② 精讲"],["quiz","③ 测试"],["feedback","④ 反馈"]].forEach(([id, label]) => {
    const b = el(`<button class="${state.stage === id ? "primary" : ""}">${label}</button>`);
    b.onclick = () => setView("module", mod.id, id);
    steps.appendChild(b);
  });
  app.appendChild(steps);

  if (state.stage === "learn") renderLearn(app, mod);
  if (state.stage === "explain") renderExplain(app, mod);
  if (state.stage === "quiz") renderQuiz(app, mod);
  if (state.stage === "feedback") renderModuleFeedback(app, mod);
}

function renderLearn(app, mod) {
  const panel = el(`<div class="panel lesson"><h3>知识点学习</h3></div>`);
  mod.learn.forEach((item) => {
    panel.appendChild(el(`
      <div class="example-step">
        <strong>${item.h}</strong>
        <div>${item.t}</div>
      </div>
    `));
  });
  const next = el(`<div class="row"><button class="primary">去精讲原题 →</button></div>`);
  next.querySelector("button").onclick = () => setView("module", mod.id, "explain");
  panel.appendChild(next);
  app.appendChild(panel);
}

function renderExplain(app, mod) {
  const e = mod.explain;
  const panel = el(`
    <div class="panel">
      <h3>${e.title}</h3>
      <div class="callout warn"><strong>题干：</strong>${e.stem}</div>
      <ol>${e.steps.map((s) => `<li>${s}</li>`).join("")}</ol>
      <div class="callout"><strong>点拨：</strong>${e.tip}</div>
      <div class="row">
        <button class="ghost" id="backLearn">← 回学习</button>
        <button class="primary" id="toQuiz">去做测试 →</button>
      </div>
    </div>
  `);
  panel.querySelector("#backLearn").onclick = () => setView("module", mod.id, "learn");
  panel.querySelector("#toQuiz").onclick = () => setView("module", mod.id, "quiz");
  app.appendChild(panel);
}

function renderQuiz(app, mod) {
  const wrap = el(`<div></div>`);
  mod.quiz.forEach((q, idx) => {
    const key = mod.id + ":" + q.id;
    const val = state.answers[key] || "";
    const done = !!state.checked[key];
    const ok = done && isCorrect(q, val);
    const bad = done && !isCorrect(q, val);
    const card = el(`
      <div class="panel">
        <div><strong>第 ${idx + 1} 题</strong>
          ${ok ? '<span class="pill ok">正确</span>' : ""}
          ${bad ? '<span class="pill bad">再看</span>' : ""}
        </div>
        <p>${q.stem}</p>
      </div>
    `);

    if (q.type === "choice") {
      const opts = el(`<div class="options"></div>`);
      q.options.forEach((opt) => {
        const letter = opt.trim()[0];
        const b = el(`<button class="${norm(val) === norm(letter) ? "primary" : ""}">${opt}</button>`);
        b.onclick = () => {
          state.answers[key] = letter;
          persist();
          render();
        };
        opts.appendChild(b);
      });
      card.appendChild(opts);
    } else {
      const input = el(`<input type="text" placeholder="输入答案" />`);
      input.value = val;
      input.oninput = (ev) => { state.answers[key] = ev.target.value; };
      input.onchange = () => persist();
      card.appendChild(input);
    }

    const row = el(`<div class="row"></div>`);
    const submit = el(`<button class="primary">提交本题</button>`);
    submit.onclick = () => {
      if (q.type === "blank") {
        const input = card.querySelector("input");
        state.answers[key] = input ? input.value : state.answers[key];
      }
      state.checked[key] = true;
      persist();
      render();
    };
    row.appendChild(submit);
    card.appendChild(row);

    if (done) {
      card.appendChild(el(`
        <div class="callout ${ok ? "ok" : "bad"}">
          <strong>${ok ? "正确。" : "再想一想。参考：" + q.answer}</strong>
          <div>${q.explain}</div>
        </div>
      `));
    }
    wrap.appendChild(card);
  });

  const s = moduleScore(mod);
  const foot = el(`
    <div class="panel">
      <p>本模块进度：已批改 ${s.done}/${s.total}，正确 ${s.ok}</p>
      <div class="row">
        <button class="ghost" id="backEx">← 回精讲</button>
        <button class="primary" id="toFb" ${s.done === 0 ? "disabled" : ""}>查看本模块反馈 →</button>
      </div>
    </div>
  `);
  foot.querySelector("#backEx").onclick = () => setView("module", mod.id, "explain");
  foot.querySelector("#toFb").onclick = () => setView("module", mod.id, "feedback");
  wrap.appendChild(foot);
  app.appendChild(wrap);
}

function renderModuleFeedback(app, mod) {
  const s = moduleScore(mod);
  let level = "还需练习";
  let tone = "warn";
  if (s.finished && s.ok === s.total) { level = "本模块过关"; tone = "ok"; }
  else if (s.pct >= 70) { level = "基本掌握，订正错题"; tone = "warn"; }
  else if (s.done === 0) { level = "尚未测试"; tone = "warn"; }
  else { level = "建议重学精讲再测"; tone = "bad"; }

  const weak = mod.quiz
    .filter((q) => state.checked[mod.id + ":" + q.id] && !isCorrect(q, state.answers[mod.id + ":" + q.id]))
    .map((q) => q.stem.replace(/\$/g, ""));

  if (s.finished) {
    state.moduleDone[mod.id] = { ok: s.ok, total: s.total, at: Date.now() };
    persist();
  }

  const panel = el(`
    <div class="panel">
      <h3>本模块反馈</h3>
      <div class="feedback-score">${s.done ? s.ok + "/" + s.done : "—"}</div>
      <div class="callout ${tone}"><strong>${level}</strong></div>
      <p>对应原卷：${mod.exam}。目标能力：${mod.goals.join("；")}。</p>
      ${weak.length ? `<h4>仍需订正</h4><ul>${weak.map((w) => `<li>${w}</li>`).join("")}</ul>` : "<p class='muted'>本模块已提交题目暂无错题。</p>"}
      <div class="callout">
        <strong>下一步建议：</strong>
        ${s.finished && s.ok === s.total
          ? "进入下一优先级模块，或打开总反馈报告查看全局。"
          : "回到精讲对照方法卡，重做错题后再次提交。"}
      </div>
      <div class="row">
        <button class="ghost" id="requiz">继续测试</button>
        <button class="primary" id="home">回总览</button>
        <button id="report">总反馈报告</button>
      </div>
    </div>
  `);
  panel.querySelector("#requiz").onclick = () => setView("module", mod.id, "quiz");
  panel.querySelector("#home").onclick = () => setView("home");
  panel.querySelector("#report").onclick = () => setView("report");
  app.appendChild(panel);
}

function renderReport() {
  const app = document.getElementById("app");
  const o = overall();
  app.innerHTML = "";
  app.appendChild(el(`
    <div class="panel">
      <h2>总反馈报告</h2>
      <div class="feedback-score">${o.modulesDone}/6 模块测完</div>
      <p>累计正确 ${o.ok} / 已作答 ${o.done}（题库 ${o.total} 题）</p>
    </div>
  `));

  const rows = MODULES.map((m) => {
    const s = moduleScore(m);
    let advice = "未开始测试";
    if (s.finished && s.ok === s.total) advice = "过关，保持周练 2 题";
    else if (s.finished && s.pct >= 70) advice = "订正错题后再测一次";
    else if (s.done > 0) advice = "重看精讲，完成全部测试题";
    else advice = "按 学习→精讲→测试 开始";
    return `<tr>
      <td>${m.title}</td>
      <td>${m.exam}</td>
      <td>${s.ok}/${s.done || 0}</td>
      <td>${advice}</td>
    </tr>`;
  }).join("");

  app.appendChild(el(`
    <div class="panel">
      <table>
        <thead><tr><th>知识点</th><th>原题</th><th>正确/已答</th><th>反馈建议</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `));

  const order = ["quad-interval", "profit", "inv-mono", "fixed-point", "inv-area", "rotation"];
  const next = order.map((id) => MODULES.find((m) => m.id === id)).find((m) => !moduleScore(m).finished || moduleScore(m).ok < moduleScore(m).total);

  app.appendChild(el(`
    <div class="panel">
      <h3>个性化补强路径</h3>
      <ol>
        <li>二次函数闭区间最值（分类讨论写全解）</li>
        <li>利润问题：定值方程 vs 顶点最值</li>
        <li>反比例增减性表述陷阱</li>
        <li>定点后联立韦达继续做综合</li>
        <li>反比例面积比例链</li>
        <li>旋转坐标法求长</li>
      </ol>
      ${next ? `<div class="callout"><strong>建议下一步：</strong>${next.title}（${next.exam}）</div>` : `<div class="callout ok"><strong>全部模块已测完。</strong>可清空进度再刷一轮，或只重做错题模块。</div>`}
      <div class="row">
        ${next ? `<button class="primary" id="goNext">去学习：${next.title}</button>` : ""}
        <button id="goHome">回总览</button>
      </div>
    </div>
  `));
  if (next) {
    app.querySelector("#goNext").onclick = () => setView("module", next.id, "learn");
  }
  app.querySelector("#goHome").onclick = () => setView("home");
}

function render() {
  renderTopbar();
  if (state.view === "home") renderHome();
  else if (state.view === "module") renderModule();
  else renderReport();
  renderMath(document.getElementById("app"));
}

document.addEventListener("DOMContentLoaded", () => {
  if (!window.katex) {
    console.error("KaTeX failed to load from vendor/katex/");
  }
  render();
});
</script>
</body>
